name: Build and publish Docker images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names (lowercase)
        run: |
          IMAGE_REPO_LOWER=${GITHUB_REPOSITORY,,}
          echo "IMAGE_API=${IMAGE_REPO_LOWER}-api" >> $GITHUB_ENV
          echo "IMAGE_WEB=${IMAGE_REPO_LOWER}-web" >> $GITHUB_ENV
          echo "IMAGE_DATA=${IMAGE_REPO_LOWER}-data" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push WEB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

      - name: Build and push DATA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.data
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_DATA }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_DATA }}:${{ github.sha }}
