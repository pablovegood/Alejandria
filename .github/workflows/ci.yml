name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # o la que uses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pip install -r requirements-dev.txt  # si tienes uno

      - name: Show Docker info
        run: |
          docker info
          docker compose version

      - name: Run tests
        env:
          CI: "true"   # esto ya lo pone GitHub, pero lo dejamos explícito
        run: |
          invoke test

      # Limpieza extra por si tus imágenes ocupan mucho
      - name: Clean Docker
        if: always()
        run: |
          docker system prune -af || true
          docker volume prune -f || true
