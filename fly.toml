app = "alejandria"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.api"

[env]
  ENV = "prod"
  PORT = "8000"

  # ✅ Textos dentro de la imagen (no volumen)
  TEXTS_PATH = "/app/data/texts"

  # ✅ TODA persistencia aquí (SQLite, users, reviews, etc)
  ALEJANDRIA_DATA_DIR = "/data"

[[mounts]]
  source = "alejandria_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
