<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Iniciar sesión · Alejandría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="login.css"/>
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-head">
        <div class="auth-logo" aria-hidden="true">⟁</div>
        <div>
          <h1>Bienvenido a Alejandría</h1>
          <p>Accede a tu biblioteca personal.</p>
        </div>
      </header>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <label>
          Usuario
          <input id="username" name="username" type="text" placeholder="tu_usuario" required autocomplete="username"/>
        </label>

        <label class="password-row">
          Contraseña
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" id="togglePwd" class="pwd-toggle" aria-label="Mostrar/ocultar contraseña">👁</button>
          </div>
        </label>

        <button type="submit" class="btn-primary">Entrar</button>

        <div id="msg" class="auth-msg" role="status" aria-live="polite"></div>
      </form>

      <div class="auth-foot">
        ¿No tienes cuenta? <a href="/static/signup.html">Crear cuenta</a>
      </div>
    </section>

    <aside class="auth-side">
      <div class="side-card">
        <h2>Lectura rápida</h2>
        <p>Explora miles de libros de dominio público, toma préstamos y lee con modo sepia y búsqueda.</p>
        <ul>
          <li>✅ Catálogo completo</li>
          <li>✅ Reseñas desplegables</li>
          <li>✅ Visor mejorado</li>
        </ul>
      </div>
    </aside>
  </main>

  <script>
    const msg = document.getElementById("msg");

    document.getElementById("togglePwd").addEventListener("click", () => {
      const pwd = document.getElementById("password");
      pwd.type = pwd.type === "password" ? "text" : "password";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "auth-msg";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        msg.textContent = "Completa usuario y contraseña.";
        msg.classList.add("err");
        return;
      }

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = data.detail || "No se pudo iniciar sesión.";
          msg.classList.add("err");
          return;
        }

        localStorage.setItem("username", data.username);
        msg.textContent = `Bienvenido, ${data.username} ✅`;
        msg.classList.add("ok");

        setTimeout(() => {
          window.location.href = "/static/index.html";
        }, 600);

      } catch {
        msg.textContent = "Error de red. Inténtalo otra vez.";
        msg.classList.add("err");
      }
    });
  </script>
</body>
</html>
