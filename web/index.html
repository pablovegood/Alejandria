<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Alejandría · Biblioteca remota</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="index.css"/>
</head>

<body>
  <header>
    <h1>Alejandría</h1>
    <nav>
      <button id="logoutBtn" class="logout" title="Cerrar sesión">Cerrar sesión</button>
    </nav>
  </header>

  <main>
    <!-- 🔹 Panel de usuario -->
    <section class="user-panel">
      <div id="userInfo">👤 Usuario: <span id="usernameSpan">anon</span></div>
      <div id="message" class="message"></div>
    </section>

    <!-- 🔹 Tus préstamos -->
    <section id="loansSection">
      <h2>
        📚 Tus préstamos
        <span id="loanCounter" class="loan-counter">0/4</span>
      </h2>

      <div id="userLoans" class="user-loans"></div>
      <p id="noLoansMsg" class="empty-msg">Aún no tienes préstamos activos.</p>
    </section>

    <!-- 🔹 Buscador -->
    <section>
      <form id="searchForm" class="search">
        <input id="q" name="q" placeholder="Buscar por título o autor..." autofocus />
        <button type="submit">Buscar</button>
      </form>
    </section>

    <!-- 🔹 Resultados -->
    <section id="resultsSection">
      <h2>🔎 Resultados</h2>
      <div id="results" class="results"></div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <footer>
    <small>Catálogo vía Gutendex · Préstamos y reseñas locales</small>
  </footer>

  <!-- ✅ Ahora todo el JS vive aquí -->
  <script src="app.js" defer></script>
</body>
</html>
