<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Visor · Alejandría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --egypt-red: #ce1126;
      --egypt-black: #0b0b0d;
      --egypt-white: #f8f8f8;
      --egypt-gold: #c9a227;

      --bg: #070708;
      --panel: rgba(20, 20, 26, 0.78);
      --stroke: rgba(255, 255, 255, 0.10);
      --text: rgba(248, 248, 248, 0.92);
      --muted: rgba(248, 248, 248, 0.62);

      --reader-font: ui-serif, Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 0%, rgba(201, 162, 39, 0.12), transparent 55%),
                  radial-gradient(1000px 700px at 90% 10%, rgba(206, 17, 38, 0.10), transparent 55%),
                  linear-gradient(180deg, #050506 0%, #070708 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 12, 15, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--stroke);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title small {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
      font-family: ui-sans-serif, system-ui;
      -webkit-tap-highlight-color: transparent;
    }

    .btn.primary {
      border: 0;
      color: #0b0b0d;
      background: linear-gradient(135deg, var(--egypt-gold), #f4d35e);
    }

    .input, .select {
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(18, 18, 24, 0.75);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-family: ui-sans-serif, system-ui;
    }

    .input { width: 220px; }
    .select { width: 170px; }

    .progress {
      height: 3px;
      background: rgba(255,255,255,0.10);
      position: relative;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--egypt-red), var(--egypt-gold));
    }

    main {
      padding: 18px 18px 70px;
      display: grid;
      place-items: center;
    }

    .reader {
      width: min(920px, 100%);
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      line-height: 1.7;
      font-size: 1.12rem;
      word-break: break-word;
      font-family: var(--reader-font);
    }

    /* Cuando reflow está ON, usamos texto fluido en párrafos */
    .reader.reflow {
      white-space: normal;
    }
    .reader.no-reflow {
      white-space: pre-wrap;
    }
    .p {
      margin: 0 0 14px 0;
    }

    body.sepia {
      background: #f4ecd8;
      color: #1a1205;
    }
    body.sepia header {
      background: rgba(244, 236, 216, 0.92);
      border-bottom: 1px solid rgba(0,0,0,0.10);
    }
    body.sepia .btn, body.sepia .input, body.sepia .select {
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.15);
      color: #1a1205;
    }
    body.sepia .reader {
      background: rgba(0,0,0,0.02);
      border-color: rgba(0,0,0,0.10);
    }

    mark {
      background: rgba(201, 162, 39, 0.35);
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
    }

    /* ===== Mobile ===== */
    @media (max-width: 640px){
      header{
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      .controls{
        justify-content: flex-start;
      }
      .btn{height:44px;}
      .input, .select{
        height:44px;
        width:100%;
      }
      main{padding: 14px 12px 90px;}
      .reader{padding: 14px;}
    }
  </style>
</head>

<body>
  <header>
    <div class="title">
      <h1 id="bookTitle">Cargando…</h1>
      <small id="bookMeta">Visor de lectura · Alejandría</small>
    </div>

    <div class="controls">
      <button id="decreaseFont" class="btn">A-</button>
      <button id="increaseFont" class="btn">A+</button>

      <select id="fontSelect" class="select" title="Fuente">
        <option value="serif">Serif</option>
        <option value="sans">Sans</option>
        <option value="mono">Monospace</option>
      </select>

      <button id="toggleReflow" class="btn" title="Reordenar texto (reflow)">Reflow</button>
      <button id="toggleTheme" class="btn">🌗</button>

      <input id="searchInside" class="input" placeholder="Buscar en el texto…"/>
      <button id="searchBtn" class="btn">Buscar</button>

      <button id="volver" class="btn primary">Volver</button>
    </div>
  </header>

  <div class="progress"><div id="bar"></div></div>

  <main>
    <article class="reader no-reflow" id="bookContent">Cargando texto…</article>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const title = params.get("title") || "Libro";

    const contentDiv = document.getElementById("bookContent");
    const titleEl = document.getElementById("bookTitle");
    const metaEl = document.getElementById("bookMeta");
    const bar = document.getElementById("bar");

    let rawText = "";
    let fontSize = parseFloat(localStorage.getItem("fontSize")) || 1.12;
    let theme = localStorage.getItem("theme") || "dark";
    let fontMode = localStorage.getItem("fontMode") || "serif";
    let reflow = localStorage.getItem("reflow") === "1";

    titleEl.textContent = title;
    metaEl.textContent = `ID ${id} · Ajustes guardados`;

    function setReaderFont(mode){
      if (mode === "sans") {
        document.documentElement.style.setProperty("--reader-font", 'ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial');
      } else if (mode === "mono") {
        document.documentElement.style.setProperty("--reader-font", 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace');
      } else {
        document.documentElement.style.setProperty("--reader-font", 'ui-serif, Georgia, "Times New Roman", serif');
      }
    }

    function normalizeToParagraphs(text){
      // Convierte saltos de línea duros en párrafos fluidos.
      // - respeta doble salto como párrafo
      // - une líneas dentro del mismo párrafo
      const cleaned = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
      if (!cleaned) return [];

      const blocks = cleaned.split(/\n{2,}/g);
      return blocks.map(b =>
        b
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean)
          .join(" ")
          .replace(/\s{2,}/g, " ")
          .trim()
      ).filter(Boolean);
    }

    function renderText(){
      if (!rawText) {
        contentDiv.textContent = "⚠️ Texto vacío";
        return;
      }

      // Limpia resaltados
      contentDiv.innerHTML = "";

      contentDiv.style.fontSize = fontSize + "rem";
      document.body.classList.toggle("sepia", theme === "sepia");
      setReaderFont(fontMode);

      if (!reflow){
        contentDiv.classList.remove("reflow");
        contentDiv.classList.add("no-reflow");
        contentDiv.textContent = rawText;
        return;
      }

      // reflow ON: renderiza párrafos en HTML (se adapta al ancho)
      contentDiv.classList.remove("no-reflow");
      contentDiv.classList.add("reflow");

      const paras = normalizeToParagraphs(rawText);
      contentDiv.innerHTML = paras.map(p => `<p class="p">${escapeHTML(p)}</p>`).join("");
    }

    function escapeHTML(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    document.getElementById("increaseFont").onclick = () => {
      fontSize = Math.min(fontSize + 0.08, 2.2);
      localStorage.setItem("fontSize", fontSize);
      renderText();
    };

    document.getElementById("decreaseFont").onclick = () => {
      fontSize = Math.max(fontSize - 0.08, 0.9);
      localStorage.setItem("fontSize", fontSize);
      renderText();
    };

    document.getElementById("toggleTheme").onclick = () => {
      theme = theme === "dark" ? "sepia" : "dark";
      localStorage.setItem("theme", theme);
      renderText();
    };

    document.getElementById("toggleReflow").onclick = () => {
      reflow = !reflow;
      localStorage.setItem("reflow", reflow ? "1" : "0");
      document.getElementById("toggleReflow").textContent = reflow ? "Reflow ✓" : "Reflow";
      renderText();
    };

    document.getElementById("fontSelect").onchange = (e) => {
      fontMode = e.target.value;
      localStorage.setItem("fontMode", fontMode);
      renderText();
    };

    document.getElementById("volver").onclick = () => {
      window.location.href = "/static/index.html";
    };

    function updateProgress() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      bar.style.width = pct.toFixed(1) + "%";
    }
    window.addEventListener("scroll", updateProgress);

    // Buscar dentro del texto
    function clearMarks(){
      renderText();
    }

    function highlight(term){
      if (!term) return;

      // buscar en lo que esté renderizado (reflow o raw)
      const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(safe, "gi");

      if (!reflow){
        const raw = contentDiv.textContent;
        contentDiv.innerHTML = escapeHTML(raw).replace(re, (m) => `<mark>${m}</mark>`);
        return;
      }

      // reflow: marcar dentro de cada <p>
      const ps = contentDiv.querySelectorAll("p.p");
      ps.forEach(p => {
        const t = p.textContent;
        p.innerHTML = escapeHTML(t).replace(re, (m) => `<mark>${m}</mark>`);
      });
    }

    document.getElementById("searchBtn").onclick = () => {
      const term = document.getElementById("searchInside").value.trim();
      clearMarks();
      highlight(term);
    };

    // Cargar texto
    async function loadBook(){
      try{
        const res = await fetch(`/catalog/read/${id}`);
        if(!res.ok) throw new Error("Texto no disponible");
        rawText = await res.text();
        document.getElementById("toggleReflow").textContent = reflow ? "Reflow ✓" : "Reflow";
        document.getElementById("fontSelect").value = fontMode;
        renderText();
        updateProgress();
      }catch{
        rawText = "";
        contentDiv.textContent = "⚠️ Error: Texto no disponible";
      }
    }

    loadBook();
  </script>
</body>
</html>
